 - name: Upload running configuration to AWS S3
      amazon.aws.s3_object:
        bucket: "aux-cml-bucket"
        object: "cml-backups/{{ inventory_hostname }}/{{ inventory_hostname }}-running-config-{{ backup_time }}.cfg"
        content: "{{ running_config.stdout[0] }}\n"
        mode: put
        region: "us-east-2"
        encrypt: true
        encryption_mode: AES256
        permission: []
      delegate_to: localhost
      no_log: true

---
- name: Identify Job Runtime
  hosts: all
  gather_facts: no

  tasks:

    - name: Show container details
      shell: |
        hostname
        whoami
        pwd

        echo ""
        echo "Runner"

        ls -la /runner 2>/dev/null

        echo ""
        echo "Mounts"

        mount | sort
      delegate_to: localhost

      register: runtime

    - debug:
        var: runtime.stdout_lines

---
- name: Test Exposed Host Path
  hosts: all
  gather_facts: no

  tasks:

    - name: Verify path visibility
      ansible.builtin.shell: |
        whoami
        pwd
        ls -ld /opt/network-automation
        ls -ld /opt/network-automation/running-configs
        ls -ld /opt/network-automation/alerts
      delegate_to: localhost

      register: output

    - debug:
        var: output.stdout_lines

---
- name: Test EE Filesystem
  hosts: all
  gather_facts: no

  tasks:

    - name: Check for mount
      shell: |
        echo "PWD=$(pwd)"
        echo ""
        ls -ld /opt || true
        ls -ld /opt/network-automation || true
        ls -ld /runner/project || true
      delegate_to: localhost

      register: test

    - debug:
        var: test.stdout_lines

---
- name: Save To Artifacts
  hosts: all
  gather_facts: no

  vars:
    backup_time: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

  tasks:

    - name: Get running config
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: running_config

    - name: Save artifact
      copy:
        content: "{{ running_config.stdout[0] }}"
        dest: "/runner/artifacts/{{ inventory_hostname }}-running-config-{{ backup_time }}.cfg"

      delegate_to: localhost

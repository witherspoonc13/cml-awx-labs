---
- name: Test Mount Visibility
  hosts: all
  gather_facts: no

  tasks:

    - name: Show mounts
      shell: |
        echo "WHOAMI:"
        whoami

        echo ""
        echo "OPT:"
        ls -ld /opt || true

        echo ""
        echo "NETWORK:"
        ls -ld /opt/network-automation || true

        echo ""
        echo "RUNNING:"
        ls -ld /opt/network-automation/running-configs || true

      delegate_to: localhost

      register: output

    - debug:
        var: output.stdout_linesnes

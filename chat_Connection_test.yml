---
- name: Validate AWX connectivity to CML routers
  hosts: all
  gather_facts: false
  connection: ansible.netcommon.network_cli

  vars:
    ansible_network_os: cisco.ios.ios
    ansible_connect_timeout: 30
    ansible_command_timeout: 30

  tasks:
    - name: Show the router being tested
      ansible.builtin.debug:
        msg:
          - "Router: {{ inventory_hostname }}"
          - "Address: {{ ansible_host | default(inventory_hostname) }}"
          - "SSH port: {{ ansible_port | default(22) }}"

    - name: Check SSH port from the AWX Execution Environment
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
        port: "{{ hostvars[inventory_hostname].ansible_port | default(22) | int }}"
        state: started
        connect_timeout: 5
        timeout: 15
        msg: >-
          FAILED: AWX could not reach the router SSH port.
          Check the inventory IP address, routing, firewalls,
          CML external connectivity, and router SSH configuration.
      changed_when: false

    - name: Validate SSH login and Cisco CLI access
      block:
        - name: Run show version and verify IOS output
          cisco.ios.ios_command:
            commands:
              - show version
            wait_for:
              - result[0] contains IOS
            retries: 1
          register: connectivity_result
          changed_when: false

      rescue:
        - name: Report SSH or CLI failure
          ansible.builtin.fail:
            msg: >-
              The SSH port is reachable, but authentication
              or the Cisco CLI check failed.
              Check AWX credentials, SSH backend dependencies,
              host key trust, and SSH algorithm compatibility.
              Original error:
              {{ ansible_failed_result.msg | default('See failed task output.') }}

    - name: Display router output
      ansible.builtin.debug:
        var: connectivity_result.stdout_lines

    - name: Report successful connectivity
      ansible.builtin.debug:
        msg: >-
          PASS: AWX reached {{ inventory_hostname }},
          authenticated over SSH, and successfully
          ran show version with IOS output.

---
- name: Test Mounted Directory
  hosts: all
  gather_facts: no

  tasks:

    - name: Test mount
      ansible.builtin.shell: |
        ls -ld /opt/network-automation
        ls -ld /opt/network-automation/running-configs
      delegate_to: localhost

      register: mount_test

    - name: Show result
      debug:
        var: mount_test.stdout_lines
